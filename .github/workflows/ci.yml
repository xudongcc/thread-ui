name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Resource utility tests
        run: |
          pnpm --filter @repo/use-resource-navigation test
          pnpm --filter @repo/graphql-connection test
          pnpm --filter @repo/use-resource-navigation check-types
          pnpm --filter @repo/graphql-connection check-types
          node --test apps/docs/lib/__tests__/*.test.mjs

      - name: DataTable tests and types
        run: |
          pnpm --filter @repo/data-table test
          pnpm --filter @repo/data-table check-types

      - name: Build
        run: pnpm build
